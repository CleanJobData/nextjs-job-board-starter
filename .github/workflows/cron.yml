name: Scheduled sync

# The schedule below is GENERATED from job-sync.config.ts, not hand-set -
# do not edit the cron expression directly. Change
# job-sync.config.ts's *IntervalHours fields instead, then run:
#
#   npx tsx scripts/sync-cron-schedule.ts
#
# and commit the result. That script is the only thing that should ever
# touch the line below. See docs/CRON.md.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: # lets you trigger it manually from the Actions tab too

jobs:
  trigger-cron:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron
        run: |
          curl -sf -X POST "${{ secrets.APP_URL }}/api/cron" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
